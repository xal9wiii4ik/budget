# Production stack for a single VPS. Standalone, NOT an override of
# docker-compose.yml: the whole published surface has to be readable in one file,
# and only caddy may publish ports. Secrets come from .env on the server — see
# .env.prod.example. The `${VAR:?...}` entries make `docker compose config` fail
# loudly instead of booting a half-configured stack.
#
# Three settings must stay byte-identical to the dev file or presigned receipt
# links break: the `minio.localhost` network alias, `--address ":9010"`, and
# `S3_ENDPOINT_URL=http://minio.localhost:9010`.
name: budget-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    # The only published ports in the stack. UDP/443 is HTTP/3.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required (public hostname, e.g. 1-2-3-4.sslip.io)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The ACME account and the issued certificates live here. Losing this
      # volume means re-issuance and burns Let's Encrypt rate limit — never
      # `down -v` in production.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      # Repo root: the SPA imports @budget/shared and @budget/api-client as
      # workspace packages, so pnpm needs the whole workspace to resolve them.
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative, same as dev: the SPA calls /api on its own origin and
        # nginx.conf proxies it. Vite inlines this at build time.
        VITE_API_URL: /api
    restart: unless-stopped
    <<: *logging
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    # Migrations run in the same step that starts the server: a container that
    # boots against an out-of-date schema would fail later, in a request, instead
    # of here where the failure is visible.
    #
    # Real client IP, three hops: Caddy REPLACES any client-supplied X-Forwarded-For
    # with the real peer IP (no trusted_proxies configured => nothing is trusted,
    # Caddy >=2.5) -> nginx appends its own view via $proxy_add_x_forwarded_for, so
    # the API sees "client, caddy" -> uvicorn with --forwarded-allow-ips='*' takes the
    # LEFTMOST entry = the client. Per-IP rate limits key on that value, so this is
    # only safe because api:8000 is NOT published: nothing outside this network can
    # hand uvicorn a hand-written header.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn budget_api.app:create_app --factory --host 0.0.0.0 --port 8000
      --forwarded-allow-ips='*'"
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgresql+asyncpg://budget:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/budget
      # Rotating this invalidates every issued session.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Byte-identical to dev on purpose: nginx.conf hardcodes this string in
      # sub_filter and re-sends it as the Host on /storage/, so the presigned
      # signature only survives while the API signs exactly this host.
      S3_ENDPOINT_URL: http://minio.localhost:9010
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      CORS_ORIGINS: '["https://${SITE_DOMAIN}"]'
      # The remote MCP connector's public identity: issuer, resource and every
      # URL the two well-known documents publish. DERIVED from SITE_DOMAIN, so
      # there is nothing to add to .env; the override exists only for a stand
      # reached on a non-standard port, which compose cannot know.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${SITE_DOMAIN}}
      # Without it the advisor and receipt parsing answer 503 AI_NOT_CONFIGURED.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Web push: all three or the feature is off and the daily job is a no-op.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: budget
    # No docker/postgres/init mount: the second database it creates (budget_test)
    # is a dev-only artifact.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # Built from source (deploy/minio/Dockerfile): MinIO no longer publishes
    # images. minio-init and mc reuse this image, so it is built once.
    build:
      context: ./deploy/minio
    image: budget-minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    <<: *logging
    # 9010 inside the container too, and the alias below, so that one single URL
    # — http://minio.localhost:9010 — is what the API signs, what nginx rewrites
    # out of API JSON, and what nginx sends back as Host on /storage/.
    command: server /data --address ":9010" --console-address ":9011"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      default:
        aliases:
          - minio.localhost
    healthcheck:
      # The image's built-in "local" alias points at the default 9000, which this
      # container no longer listens on — the alias is re-pointed before the probe.
      # `$$` so the container's own shell expands its own env: the credentials are
      # not interpolated by compose and never reach `docker ps` output.
      test:
        - CMD-SHELL
        - mc alias set health http://127.0.0.1:9010 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
          >/dev/null && mc ready health
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: budget-minio:RELEASE.2025-04-22T22-12-26Z
    <<: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # List form, and `$$` as in the healthcheck: the credentials are expanded by
    # the container's own shell, not interpolated into this file by compose.
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9010 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/receipts

  # Backup/restore reach MinIO through this one-shot: `docker compose
  # -f docker-compose.prod.yml run --rm mc sh -c '…'`. The empty entrypoint
  # replaces the image's `mc` so an arbitrary shell line can run; the profile
  # keeps it out of `up -d`; the env means no script passes a secret on the
  # command line.
  mc:
    image: budget-minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["tools"]
    entrypoint: [""]
    <<: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    volumes:
      - ${BACKUP_DIR:-/var/backups/budget}:/backup

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
