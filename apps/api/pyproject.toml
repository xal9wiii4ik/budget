[project]
name = "budget-api"
version = "0.1.0"
description = "Budget app FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.0",
    # 3.x AsyncIOScheduler (architecture D3). Capped below 4.x: that release is a
    # rewrite with a different API (schedulers become async context managers), so an
    # unpinned major bump would silently break the lifespan wiring in app.py.
    "apscheduler>=3.10,<4",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    # A RUNTIME dependency since the mcp-remote scope: the API process itself now
    # serves /mcp and the OAuth authorization server built on this SDK's handlers,
    # so `uv sync --frozen --no-dev` (the API image) MUST carry it. Capped below
    # 3.x: the auth provider protocol and the streamable-HTTP manager are the two
    # surfaces we build on, and a major bump is free to move both.
    "mcp>=2.2,<3",
    "minio>=7.2.20",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.2",
    "pywebpush>=2.5,<3",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# An EMPTY, NO-OP ALIAS kept on purpose (ruling R4). The SDK moved into
# `dependencies` above, but `--extra mcp` is in the documented stdio launch line
# and in the owner's Claude Desktop config:
# `uv run --frozen --extra mcp --directory <abs>/apps/api python -m budget_api.mcp`.
# An extra that no longer exists makes uv fail outright, so the name stays and
# resolves to nothing.
mcp = []

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    # The `mcp` EXTRA, pulled in by self-reference: PEP 735 groups cannot include
    # an extra directly, and the default `uv run pytest` has to import the SDK or
    # tests/test_mcp_server.py (the in-memory client, the upload gates) would
    # silently stop being a guard. `uv sync --no-dev` (the API image) still gets
    # neither the group nor the extra.
    "budget-api[mcp]",
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The advisor's system prompt (and the tests that pin it) is Russian PROSE, and
# RUF001/RUF003 flag ordinary all-Cyrillic words — "Все", "НЕ", the prepositions
# "с"/"о"/"у" — as possible Latin homoglyphs. In a file whose strings are meant to
# be Cyrillic that is pure noise, and contorting the copy to dodge the heuristic
# would make every future prompt edit a lint puzzle. Scoped to these two files, so
# a genuine homoglyph anywhere else in the package is still caught.
"src/budget_api/services/advisor.py" = ["RUF001", "RUF003"]
"tests/test_advisor.py" = ["RUF001", "RUF003"]
# Same reasoning, one scope later: the Priorbank parser's landmarks ARE Cyrillic
# strings copied out of the bank's own export ("Всего", "Операции по", the
# "Валюта контракта" header), and its number cleaner has to name NBSP and narrow
# NBSP as literals — the thousands separators the real file uses. RUF001/RUF003
# flag every one of those as a possible Latin homoglyph, which in a file whose
# whole job is to recognize that exact text is pure noise. The synthetic fixture
# builder in the parser test is the same text, so it carries the same scope.
"src/budget_api/services/statement_import/priorbank.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_statement_parser.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_statement_imports_api.py" = ["RUF001", "RUF002", "RUF003"]
# The LLM pass's test builds the same Priorbank landmarks and matches them against
# a Cyrillic SEED CATEGORY name, so it carries the same scope.
"tests/test_statement_imports_ai.py" = ["RUF001", "RUF003"]
# Same reasoning again: the anonymizer's rules ARE Cyrillic literals — the
# bookkeeping phrases of the owner's export ("РАЗОВАЯ", "Дата — допущение"), the
# relation-word stems, and the Cyrillic character classes of the person-name
# pattern. RUF001/RUF003 flag every capital in "РАЗОВАЯ" as a possible Latin
# homoglyph, which in a file whose whole job is to recognize that exact text is
# pure noise; its test carries the same literals and the same scope.
"evals/anonymize.py" = ["RUF001", "RUF003"]
"tests/test_evals_anonymize.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.pyright]
# ``evals`` is a first-class directory, not a scratch script: the CI regression
# test imports it, so it is type-checked exactly like ``src`` and ``tests``.
include = ["src", "tests", "evals"]
exclude = ["alembic", "**/.venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

# pyright 1.1.411 does not support per-executionEnvironment `typeCheckingMode`
# (its exec-env parser accepts only root/extraPaths/pythonVersion/pythonPlatform/
# name + individual diagnostic-rule overrides). Global mode stays strict (the
# valuable half: strict on src/); the tests env relaxes only the strict-only rule
# that misfires on idiomatic pytest code (autouse fixtures read as unused). All
# other strict rules still apply to tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
# `.` so the regression test's `from evals.run import …` resolves (the evals
# package is not installed — it ships beside the app, not inside it), and `src`
# because naming extraPaths here REPLACES pyright's implicit src-layout path,
# which is how `budget_api` itself is found.
extraPaths = [".", "src"]
reportUnusedFunction = "none"

[tool.pytest.ini_options]
# ``apps/api`` itself on the path: ``tests/test_evals_regression.py`` imports
# ``evals.run`` and drives it in-process (no subprocess, no network), and the
# evals package is not installed — it ships beside the app, not inside it.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
