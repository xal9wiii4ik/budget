[project]
name = "budget-api"
version = "0.1.0"
description = "Budget app FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["alembic", "**/.venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

# pyright 1.1.411 does not support per-executionEnvironment `typeCheckingMode`
# (its exec-env parser accepts only root/extraPaths/pythonVersion/pythonPlatform/
# name + individual diagnostic-rule overrides). Global mode stays strict (the
# valuable half: strict on src/); the tests env relaxes only the strict-only rule
# that misfires on idiomatic pytest code (autouse fixtures read as unused). All
# other strict rules still apply to tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
