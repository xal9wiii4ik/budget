# Behind a TLS terminator (Caddy, in prod) this container is reached over plain
# http, so $scheme says "http"; the browser's real scheme is in the header. A
# whitelist, not a pass-through: anything that is not exactly https/http (no
# header at all in dev, or a junk value) falls back to $scheme.
map $http_x_forwarded_proto $fwd_proto {
    https   https;
    http    http;
    default $scheme;
}

# Static host for the built SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /transactions, /accounts and friends are React Router
    # paths, not files on disk. Without this fallback a page reload on any route
    # other than / returns 404 from nginx before the app ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The two anti-framing headers live HERE and not in `location /`: the SPA
    # fallback internally redirects to /index.html, so this is the block that
    # actually serves every app route — and nginx's add_header does not inherit
    # into a block that has its own, which this one does (the Cache-Control
    # below). The OAuth consent page is the reason: a connector approval screen
    # inside a hostile iframe is a clickjacked "Allow".
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # ---- Same-origin API -------------------------------------------------
    # The SPA calls /api/... on its OWN origin, and this proxies it to the API
    # container. Nothing about the API's address is baked into the bundle any
    # more (VITE_API_URL=/api), so the site works from whatever address the
    # browser used to reach it — localhost on the Mac, the Mac's LAN address or
    # Bonjour name from a phone, a real domain after deploy — and there is no
    # cross-origin request left for CORS to refuse.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API's per-IP rate limits key on the client address; without these
        # every browser would arrive as this container and share one limit.
        # docker-compose.yml starts uvicorn with --forwarded-allow-ips to trust them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # A statement upload is the largest body the API takes (1 MB cap).
        client_max_body_size 2m;

        # Presigned storage links point at http://minio.localhost:9010, a name
        # that only resolves on the Mac. Rewritten here to /storage/ on this
        # origin, which the next block serves — only for responses that go
        # through the web; the phone app and MCP talk to :8010 directly and keep
        # the original links. Bodies must arrive uncompressed for sub_filter.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter 'http://minio.localhost:9010/' '/storage/';
        sub_filter_once off;
    }

    # The advisor answers as a server-sent-event stream: no buffering, no
    # rewriting, and a read timeout long enough for a slow model.
    location /api/advisor/ {
        proxy_pass http://api:8000/advisor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---- Remote MCP connector ----------------------------------------------
    # Claude talks to https://<domain>/mcp and discovers everything else from
    # /.well-known/oauth-*, so both have to answer on the SITE's origin — the
    # /api/ prefix exists only between this container and the API, and the two
    # well-known paths are fixed by RFC 8414/9728 at the root of the host.
    #
    # Both blocks share one set of knobs, and each one earns its line:
    #   proxy_http_version 1.1 + Connection ""  keep-alive and, in SSE mode, a
    #       response that is not cut off by a 1.0 downgrade;
    #   proxy_buffering/proxy_cache off          an MCP response is a dialogue,
    #       never a cacheable document (the metadata ones carry no-store anyway);
    #   proxy_read_timeout 300s                  a tool call runs a real query;
    #   client_max_body_size 4m                  the SDK's own request-body cap.
    # NO sub_filter, deliberately: these bodies are JSON-RPC and RFC metadata,
    # and the /api/ block's presigned-link rewrite (with its Accept-Encoding "")
    # must not reach them. add_header/sub_filter do not inherit between sibling
    # locations, so nothing here is picked up from /api/.
    location = /mcp {
        proxy_pass http://api:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }

    # A pasted /mcp/ must fail honestly instead of falling into `location /` and
    # answering index.html with 200 — and never with a 3xx, which drops Authorization.
    location = /mcp/ {
        return 404;
    }

    # A PREFIX, not two exact matches: it already covers both
    # /.well-known/oauth-protected-resource[/mcp] and
    # /.well-known/oauth-authorization-server, and any future oauth-* document
    # arrives proxied instead of as a 404 from this container. proxy_pass with NO
    # URI part is what forwards the path VERBATIM — adding even a trailing slash
    # would make nginx replace the matched prefix and break every path here.
    location /.well-known/oauth- {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }

    # ---- Receipt storage ---------------------------------------------------
    # The rewritten presigned links land here. The signature covers the Host
    # header and the path, so both are put back exactly as they were signed:
    # Host minio.localhost:9010, and /storage/<bucket>/<key> -> /<bucket>/<key>.
    location /storage/ {
        proxy_pass http://minio:9010/;
        proxy_http_version 1.1;
        proxy_set_header Host minio.localhost:9010;
        # The receipt cap is 5 MB on the clients and 10 MB on the MCP path.
        client_max_body_size 12m;
        proxy_request_buffering off;
    }

    # The install surface. None of these three is content-hashed, so none may be
    # cached for long: a worker or a manifest that outlives a deploy is exactly
    # the stale-app failure the worker itself is written to avoid. "no-cache" =
    # keep it, but ask the server every time.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
    }

    # nginx's stock mime.types does not know .webmanifest and would serve it as
    # application/octet-stream, which Chrome refuses as a manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }
}
