# Behind a TLS terminator (Caddy, in prod) this container is reached over plain
# http, so $scheme says "http"; the browser's real scheme is in the header. A
# whitelist, not a pass-through: anything that is not exactly https/http (no
# header at all in dev, or a junk value) falls back to $scheme.
map $http_x_forwarded_proto $fwd_proto {
    https   https;
    http    http;
    default $scheme;
}

# Static host for the built SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /transactions, /accounts and friends are React Router
    # paths, not files on disk. Without this fallback a page reload on any route
    # other than / returns 404 from nginx before the app ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- Same-origin API -------------------------------------------------
    # The SPA calls /api/... on its OWN origin, and this proxies it to the API
    # container. Nothing about the API's address is baked into the bundle any
    # more (VITE_API_URL=/api), so the site works from whatever address the
    # browser used to reach it — localhost on the Mac, the Mac's LAN address or
    # Bonjour name from a phone, a real domain after deploy — and there is no
    # cross-origin request left for CORS to refuse.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API's per-IP rate limits key on the client address; without these
        # every browser would arrive as this container and share one limit.
        # docker-compose.yml starts uvicorn with --forwarded-allow-ips to trust them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # A statement upload is the largest body the API takes (1 MB cap).
        client_max_body_size 2m;

        # Presigned storage links point at http://minio.localhost:9010, a name
        # that only resolves on the Mac. Rewritten here to /storage/ on this
        # origin, which the next block serves — only for responses that go
        # through the web; the phone app and MCP talk to :8010 directly and keep
        # the original links. Bodies must arrive uncompressed for sub_filter.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter 'http://minio.localhost:9010/' '/storage/';
        sub_filter_once off;
    }

    # The advisor answers as a server-sent-event stream: no buffering, no
    # rewriting, and a read timeout long enough for a slow model.
    location /api/advisor/ {
        proxy_pass http://api:8000/advisor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---- Receipt storage ---------------------------------------------------
    # The rewritten presigned links land here. The signature covers the Host
    # header and the path, so both are put back exactly as they were signed:
    # Host minio.localhost:9010, and /storage/<bucket>/<key> -> /<bucket>/<key>.
    location /storage/ {
        proxy_pass http://minio:9010/;
        proxy_http_version 1.1;
        proxy_set_header Host minio.localhost:9010;
        # The receipt cap is 5 MB on the clients and 10 MB on the MCP path.
        client_max_body_size 12m;
        proxy_request_buffering off;
    }

    # The install surface. None of these three is content-hashed, so none may be
    # cached for long: a worker or a manifest that outlives a deploy is exactly
    # the stale-app failure the worker itself is written to avoid. "no-cache" =
    # keep it, but ask the server every time.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
    }

    # nginx's stock mime.types does not know .webmanifest and would serve it as
    # application/octet-stream, which Chrome refuses as a manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }
}
