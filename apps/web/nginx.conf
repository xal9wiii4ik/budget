# Static host for the built SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: /transactions, /accounts and friends are React Router
    # paths, not files on disk. Without this fallback a page reload on any route
    # other than / returns 404 from nginx before the app ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The install surface. None of these three is content-hashed, so none may be
    # cached for long: a worker or a manifest that outlives a deploy is exactly
    # the stale-app failure the worker itself is written to avoid. "no-cache" =
    # keep it, but ask the server every time.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /offline.html {
        add_header Cache-Control "no-cache";
    }

    # nginx's stock mime.types does not know .webmanifest and would serve it as
    # application/octet-stream, which Chrome refuses as a manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }
}
