name: ci-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: ruff / pyright / alembic / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real env vars beat apps/api/.env (pydantic-settings) — the suite and
      # alembic both land on the service container, never on a developer DB.
      TEST_DATABASE_URL: postgresql+asyncpg://budget:budget@localhost:5432/budget_test
      DATABASE_URL: postgresql+asyncpg://budget:budget@localhost:5432/budget_test
      JWT_SECRET: ci-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # Python 3.12 comes from apps/api/.python-version; uv provisions it itself.
      - name: Install dependencies (frozen lock)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic check (models vs migrations)
        run: uv run alembic check

      - name: Pytest
        run: uv run pytest
